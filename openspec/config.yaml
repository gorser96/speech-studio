schema: spec-driven

context: |
  SpeechStudio — Android, Kotlin, Jetpack Compose, один модуль app, offline-first; backend и синхронизация вне MVP.
  До проектирования и реализации обязательно прочитай ARCHITECTURE.md и следуй применимым решениям.
  Фактическое состояние проверяй по исходникам и Gradle; целевые технологии не считай реализованными.
  Навигация и проверки: AGENTS.md, PACKAGES.md и PACKAGE.md только затронутых пакетов.
  Запуск эмулятора Pixel 7a, установка и ручная проверка приложения: src/speechstudio-mobile/TESTING.md.
  Контракты: openspec/specs/; индекс и процесс: openspec/README.md. Статус приёмки: openspec/verification/README.md.
  Пиши по-русски, сохраняя служебный формат OpenSpec. Короткие артефакты, ссылки вместо повторов.
  Тестирование минимально достаточное по риску. Сначала существующие проверки; новые только для непокрытого существенного правила, регрессии или риска потери данных.
  Не дублируй сценарии между слоями; без обязательного TDD, квот покрытия и теста на каждый класс.

rules:
  proposal:
    - Кратко укажи цель, границы и затронутые возможности. Не переписывай архитектуру.
  specs:
    - Описывай наблюдаемое поведение и критерии приёмки; сценарий не требует отдельного автотеста.
    - Сохраняй формат Requirement/Scenario и нормативные ключевые слова OpenSpec.
  design:
    - Укажи применимые решения ARCHITECTURE.md, затронутые слои и контракты; отклонения обоснуй явно.
    - Выбери минимальные проверки по конкретным рискам; для простой правки допустима ручная проверка.
  tasks:
    - Короткий список исполнимых задач без искусственного дробления по файлам и слоям.
    - Только обоснованные проверки из design; не создавай полную матрицу тестов автоматически.

operations:
  apply:
    guidance:
      - Прочитай ARCHITECTURE.md перед реализацией и проверь соответствие затронутых решений.
      - Сначала адресные существующие тесты; расширяй набор при широком влиянии, сбое или неясном риске.
      - Сохраняй полезные тесты; удаление требует доказанного дублирования или устаревания.
  archive:
    guidance:
      - Кратко укажи выполненные проверки и ограничения; непроверенные сценарии не объявляй успешными.
